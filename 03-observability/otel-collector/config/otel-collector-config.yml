# ==============================================================================
# OPENTELEMETRY COLLECTOR CONFIGURATION
# ==============================================================================
# Pipeline configuration for receiving, processing, and exporting telemetry data.
# ==============================================================================

# ------------------------------------------------------------------------------
# RECEIVERS
# ------------------------------------------------------------------------------
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  kafkametrics:
    brokers: "kafka:9092"
    protocol_version: "7.5.0"
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 10s

  prometheus:
    config:
      scrape_configs:
        - job_name: "keycloak"
          static_configs:
            - targets: ["keycloak:9000"]
          metrics_path: /metrics
          scrape_interval: 10s

  filelog:
    include: ["/var/log/keycloak/*.log"]
    start_at: beginning

# ------------------------------------------------------------------------------
# PROCESSORS
# ------------------------------------------------------------------------------
processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource/keycloak:
    attributes:
      - key: service.name
        value: "keycloak"
        action: upsert

  resource:
    attributes:
      - key: service.name
        from_attribute: service.name
        action: upsert
  attributes:
    actions:
      - key: trace_id
        from_context: trace_id
        action: upsert
      - key: span_id
        from_context: span_id
        action: upsert

  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
    spike_limit_mib: 200

# ------------------------------------------------------------------------------
# EXPORTERS
# ------------------------------------------------------------------------------
exporters:
  # Metrics to Mimir
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    timeout: 10s
    tls:
      insecure: true

  # Traces to Tempo
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Profiles to Pyroscope
  # Profiles to Pyroscope (via OTLP HTTP)
  otlphttp/pyroscope:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

  # Logs to Grafana Agent
  otlp:
    endpoint: grafana-agent:4317
    tls:
      insecure: true

  # Debugging
  debug:
    verbosity: detailed

# ------------------------------------------------------------------------------
# EXTENSIONS
# ------------------------------------------------------------------------------
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

# ==============================================================================
# SERVICE PIPELINES
# ==============================================================================
service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    # 1. Traces Pipeline
    traces:
      receivers: [otlp]
      processors: [resource/keycloak, memory_limiter, batch]
      exporters: [otlp/tempo]

    # 2. Metrics Pipeline
    metrics:
      receivers: [otlp, prometheus, kafkametrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]

    # 3. Logs Pipeline
    logs:
      receivers: [otlp, filelog]
      processors: [resource/keycloak, memory_limiter, batch]
      exporters: [otlp]

    # 4. Profiles Pipeline
    profiles:
      receivers: [otlp]
      processors: [resource/keycloak, memory_limiter]
      exporters: [otlphttp/pyroscope]
