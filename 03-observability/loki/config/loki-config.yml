# ==============================================================================
# LOKI CONFIGURATION
# ==============================================================================
# Configuration for Grafana Loki log aggregation system.
# ==============================================================================

auth_enabled: false

# ------------------------------------------------------------------------------
# SERVER CONFIGURATION
# ------------------------------------------------------------------------------
server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# ------------------------------------------------------------------------------
# DISTRIBUTOR
# ------------------------------------------------------------------------------
distributor:
  ring:
    kvstore:
      store: memberlist

# ------------------------------------------------------------------------------
# INGESTER
# ------------------------------------------------------------------------------
ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  wal:
    dir: /loki/wal

# ------------------------------------------------------------------------------
# SCHEMA & CONFIG
# ------------------------------------------------------------------------------
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: aws
      schema: v11
      index:
        prefix: index_
        period: 24h

# ------------------------------------------------------------------------------
# STORAGE CONFIG
# ------------------------------------------------------------------------------
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
  aws:
    bucketnames: loki
    endpoint: http://seaweedfs:8333
    access_key_id: ${MINIO_ACCESS_KEY:-observability-service}
    secret_access_key: ${MINIO_SECRET_KEY:-observability-service}
    insecure: true
    s3forcepathstyle: true
  filesystem:
    directory: /loki/chunks

# ------------------------------------------------------------------------------
# COMPACTOR
# ------------------------------------------------------------------------------
compactor:
  working_directory: /loki/boltdb-shipper-compactor

# ------------------------------------------------------------------------------
# LIMITS
# ------------------------------------------------------------------------------
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false

# ------------------------------------------------------------------------------
# TABLE MANGER
# ------------------------------------------------------------------------------
table_manager:
  retention_deletes_enabled: false
  retention_period: 0s

# ------------------------------------------------------------------------------
# RULER
# ------------------------------------------------------------------------------
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://mimir:9009/alertmanager
  ring:
    kvstore:
      store: inmemory
  enable_api: true

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
