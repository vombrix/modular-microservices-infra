# ==============================================================================
# MIMIR CONFIGURATION
# ==============================================================================
# Configuration for Grafana Mimir (Scalable Prometheus storage).
# ==============================================================================

# ------------------------------------------------------------------------------
# MULTITENANCY
# ------------------------------------------------------------------------------
multitenancy_enabled: false

# ------------------------------------------------------------------------------
# LIMITS
# ------------------------------------------------------------------------------
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 0

# ------------------------------------------------------------------------------
# BLOCK STORAGE
# ------------------------------------------------------------------------------
blocks_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir
    access_key_id: ${MINIO_ACCESS_KEY:-minioadmin}
    secret_access_key: ${MINIO_SECRET_KEY:-minioadmin}
    insecure: true

ruler_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir-ruler
    access_key_id: ${MINIO_ACCESS_KEY:-minioadmin}
    secret_access_key: ${MINIO_SECRET_KEY:-minioadmin}
    insecure: true

# ------------------------------------------------------------------------------
# COMPACTOR
# ------------------------------------------------------------------------------
compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

# ------------------------------------------------------------------------------
# DISTRIBUTOR
# ------------------------------------------------------------------------------
distributor:
  ring:
    kvstore:
      store: memberlist
  instance_limits:
    max_ingestion_rate: 100000
    max_inflight_push_requests: 10000

# ------------------------------------------------------------------------------
# INGESTER
# ------------------------------------------------------------------------------
ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 1

# ------------------------------------------------------------------------------
# RULER
# ------------------------------------------------------------------------------
ruler:
  rule_path: /data/mimir/rules
  alertmanager_url: http://127.0.0.1:9009/alertmanager
  ring:
    kvstore:
      store: memberlist

# ------------------------------------------------------------------------------
# ALERTMANAGER
# ------------------------------------------------------------------------------
alertmanager:
  data_dir: /data/mimir/alertmanager
  fallback_config_file: /etc/mimir/alertmanager-fallback.yml
  external_url: http://127.0.0.1:9009/alertmanager
  sharding_ring:
    kvstore:
      store: memberlist

alertmanager_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir-alertmanager
    access_key_id: ${MINIO_ACCESS_KEY:-minioadmin}
    secret_access_key: ${MINIO_SECRET_KEY:-minioadmin}
    insecure: true

# ------------------------------------------------------------------------------
# SERVER
# ------------------------------------------------------------------------------
server:
  http_listen_port: 9009
