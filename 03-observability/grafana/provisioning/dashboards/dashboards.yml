apiVersion: 1

providers:
  - name: Applications
    folder: Applications
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/applications

  - name: Observability
    folder: Observability
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/observability

  - name: Infrastructure
    folder: Infrastructure
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure
