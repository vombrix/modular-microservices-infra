# ==============================================================================
# PROMETHEUS CONFIGURATION
# ==============================================================================
# Main configuration for Prometheus metrics collection.
# ==============================================================================

# ------------------------------------------------------------------------------
# GLOBAL SETTINGS
# ------------------------------------------------------------------------------
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: "local-dev"
    environment: "development"
    region: "local"

# ------------------------------------------------------------------------------
# ALERTING RULES
# ------------------------------------------------------------------------------
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# ------------------------------------------------------------------------------
# ALERTMANAGER CONFIGURATION (via Mimir)
# ------------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "mimir:9009"
      path_prefix: /alertmanager

# ------------------------------------------------------------------------------
# REMOTE WRITE TO MIMIR
# ------------------------------------------------------------------------------
remote_write:
  - url: "http://mimir:9009/api/v1/push"
    name: mimir
    send_exemplars: true
    remote_timeout: 30s
    queue_config:
      capacity: 10000
      max_shards: 50
      max_samples_per_send: 2000

# ------------------------------------------------------------------------------
# SCRAPE CONFIGURATIONS (Jobs)
# ------------------------------------------------------------------------------
scrape_configs:
  # 1. Prometheus Itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. OpenTelemetry Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  # 3. Mimir
  - job_name: "mimir"
    static_configs:
      - targets: ["mimir:9009"]

  # 4. Tempo
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  # 5. Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # 6. Pyroscope
  - job_name: "pyroscope"
    static_configs:
      - targets: ["pyroscope:4040"]
