# ==============================================================================
# PYROSCOPE CONFIGURATION
# ==============================================================================
# Configuration for Grafana Pyroscope continuous profiling.
# ==============================================================================

# ------------------------------------------------------------------------------
# TARGETS
# ------------------------------------------------------------------------------
target: all

# ------------------------------------------------------------------------------
# MULTITENANCY
# ------------------------------------------------------------------------------
multitenancy_enabled: false

# ------------------------------------------------------------------------------
# SERVER CONFIG
# ------------------------------------------------------------------------------
server:
  http_listen_port: 4040
  log_level: info

# ------------------------------------------------------------------------------
# STORAGE
# ------------------------------------------------------------------------------
storage:
  backend: s3
  s3:
    endpoint: seaweedfs:8333
    bucket_name: pyroscope
    access_key_id: ${MINIO_ACCESS_KEY:-observability-service}
    secret_access_key: ${MINIO_SECRET_KEY:-observability-service}
    insecure: true

# ------------------------------------------------------------------------------
# PROFILING
# ------------------------------------------------------------------------------
self_profiling:
  disable_push: false

# ------------------------------------------------------------------------------
# INGESTER
# ------------------------------------------------------------------------------
ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 1

# ------------------------------------------------------------------------------
# CLUSTERING
# ------------------------------------------------------------------------------
memberlist:
  join_members:
    - pyroscope:7946

# ------------------------------------------------------------------------------
# LIMITS
# ------------------------------------------------------------------------------
limits:
  max_sessions_per_series: 0
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
