# ==============================================================================
# 04-GATEWAY STACK
# ==============================================================================
# Gateway services: Nginx, Kong, Keycloak.
# ==============================================================================
name: 04-gateway

# ------------------------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------------------------
networks:
  default:
    name: global-infra
    external: true

# ------------------------------------------------------------------------------
# VOLUMES
# ------------------------------------------------------------------------------
volumes:
  keycloak_data:

# ------------------------------------------------------------------------------
# SERVICES
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # Kong Database Migrations
  # ----------------------------------------------------------------------------
  kong-migrations:
    image: kong/kong-gateway:${KONG_VERSION:-3.4}
    container_name: kong-migrations
    restart: "no"
    command: kong migrations bootstrap
    depends_on:
      - postgres-wait
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: ${KONG_PG_HOST:-postgres}
      KONG_PG_PORT: ${KONG_PG_PORT:-5432}
      KONG_PG_DATABASE: ${KONG_DB_NAME:-kong}
      KONG_PG_USER: ${KONG_DB_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:? Check .env file}
      KONG_PG_SSL: "off"
      KONG_PG_SSL_VERIFY: "off"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=kong-migrations"
      - "com.microservices.tier=gateway"
      - "com.microservices.type=init"

  # ----------------------------------------------------------------------------
  # Kong Gateway
  # ----------------------------------------------------------------------------
  kong:
    image: kong/kong-gateway:${KONG_VERSION:-3.4}
    container_name: kong
    restart: unless-stopped
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: ${KONG_PG_HOST:-postgres}
      KONG_PG_PORT: ${KONG_PG_PORT:-5432}
      KONG_PG_DATABASE: ${KONG_DB_NAME:-kong}
      KONG_PG_USER: ${KONG_DB_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:? Check .env file}
      KONG_PG_SSL: "off"
      KONG_PG_SSL_VERIFY: "off"
      KONG_PROXY_ACCESS_LOG: ${KONG_PROXY_ACCESS_LOG:-/dev/stdout}
      KONG_ADMIN_ACCESS_LOG: ${KONG_ADMIN_ACCESS_LOG:-/dev/stdout}
      KONG_PROXY_ERROR_LOG: ${KONG_PROXY_ERROR_LOG:-/dev/stderr}
      KONG_ADMIN_ERROR_LOG: ${KONG_ADMIN_ERROR_LOG:-/dev/stderr}
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://kong.${DOMAIN_NAME:-darkstar.local}"
      KONG_ADMIN_GUI_API_URL: "http://admin-kong.${DOMAIN_NAME:-darkstar.local}"
      KONG_ADMIN_GUI_CORS_ENABLED: "true"
      KONG_ADMIN_GUI_CORS_ORIGIN: "http://kong.${DOMAIN_NAME:-darkstar.local},http://api-kong.${DOMAIN_NAME:-darkstar.local},http://admin-kong.${DOMAIN_NAME:-darkstar.local},http://localhost:8002,http://127.0.0.1:8002,http://localhost:8001,http://127.0.0.1:8001,http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000"
      KONG_ADMIN_GUI_CORS_METHODS: "GET, PUT, PATCH, DELETE, POST, OPTIONS, HEAD"
      KONG_ADMIN_GUI_CORS_HEADERS: "Accept, Accept-Version, Content-Length, Content-MD5, Content-Type, Date, X-Auth-Token, Authorization, Origin, X-Requested-With, Keep-Alive, User-Agent, If-Modified-Since, Cache-Control"
      KONG_ADMIN_GUI_CORS_CREDENTIALS: "true"
      KONG_ADMIN_GUI_CORS_MAX_AGE: "3600"
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: "16k"
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: 60
      KONG_UPSTREAM_KEEPALIVE_MAX_REQUESTS: 100
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: 60
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: info
      KONG_DNS_ORDER: A,CNAME,LAST
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_PROXY_SSL_PORT:-8445}:8443"
      - "${KONG_ADMIN_PORT:-8001}:8001"
      - "${KONG_ADMIN_SSL_PORT:-8444}:8444"
      - "8002:8002"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=kong"
      - "com.microservices.tier=gateway"
      - "com.microservices.mode=db-backed"
      - "com.microservices.database=postgres"

  # ----------------------------------------------------------------------------
  # Keycloak (Identity Management)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-23.0}
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      - postgres-wait
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:? Check .env file}
      KC_HOSTNAME: keycloak.${DOMAIN_NAME:-darkstar.local}
      KC_DB: postgres
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST:-postgres}
      KC_DB_URL_PORT: ${KEYCLOAK_DB_PORT:-5432}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Check .env file}
      KC_DB_SCHEMA: public
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_ADDRESS_FORWARDING: "true"
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-true}
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_LOG_LEVEL: info
      KC_LOG_CONSOLE_OUTPUT: json
      KC_CACHE: ispn
      KC_HTTP_MANAGEMENT_PORT: 9000
      # Pyroscope Configuration
      PYROSCOPE_APPLICATION_NAME: keycloak
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_FORMAT: jfr
      # OpenTelemetry Java Agent & Pyroscope Agent
      OTEL_SERVICE_NAME: keycloak
    volumes:
      - ./keycloak/opentelemetry-javaagent.jar:/opt/otel-javaagent/opentelemetry-javaagent.jar
      - ./keycloak/pyroscope.jar:/opt/pyroscope/pyroscope.jar:ro
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
      - "${KEYCLOAK_HTTPS_PORT:-8443}:8443"
      - "${KEYCLOAK_MGMT_PORT:-9004}:9000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=keycloak"
      - "com.microservices.tier=identity"
      - "com.microservices.database=postgres"

  # ----------------------------------------------------------------------------
  # Helper: Wait for Postgres & Init DBs
  # ----------------------------------------------------------------------------
  postgres-wait:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: postgres-wait
    restart: "no"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:? Check .env file}
      KONG_DB_NAME: ${KONG_DB_NAME:-kong}
      KONG_DB_USER: ${KONG_DB_USER:-kong}
      KONG_DB_PASSWORD: ${KONG_DB_PASSWORD:? Check .env file}
    command: >
      sh -c "
      echo 'Waiting for PostgreSQL to be ready...';
      until pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-main_db}; do
        echo 'PostgreSQL is unavailable - sleeping';
        sleep 2;
      done;
      echo 'PostgreSQL is up - checking databases...';
      
      PGPASSWORD=${KEYCLOAK_DB_PASSWORD:? Check .env file} psql -h postgres -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak} -c 'SELECT 1' > /dev/null 2>&1 || (echo 'Keycloak database not found!' && exit 1);
      echo '/ Keycloak database ready';
      
      PGPASSWORD=${KONG_DB_PASSWORD:? Check .env file} psql -h postgres -U ${KONG_DB_USER:-kong} -d ${KONG_DB_NAME:-kong} -c 'SELECT 1' > /dev/null 2>&1 || (echo 'Kong database not found!' && exit 1);
      echo '/ Kong database ready';
      
      echo 'All databases are ready!';
      "
    labels:
      - "com.microservices.service=postgres-wait"
      - "com.microservices.tier=gateway"
      - "com.microservices.type=init"

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:${NGINX_VERSION:-1.25-alpine}
    container_name: nginx
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-darkstar.local}
      - NGINX_ENVSUBST_FILTER=DOMAIN_NAME
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=nginx"
      - "com.microservices.tier=gateway"