# ==============================================================================
# POSTGRESQL CONFIGURATION
# ==============================================================================
# Main configuration file for the PostgreSQL server.
# Tuned for development/testing usage.
# ==============================================================================

# ------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
# ------------------------------------------------------------------------------
superuser_reserved_connections = 3
authentication_timeout = 1min
tcp_keepalives_idle = 600
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

# ------------------------------------------------------------------------------
# MEMORY CONFIGURATION
# ------------------------------------------------------------------------------
# Memory usage settings should be adjusted based on available system RAM.
huge_pages = try
temp_buffers = 8MB
work_mem = 2621kB
maintenance_work_mem = 64MB
autovacuum_work_mem = -1
hash_mem_multiplier = 1.0
logical_decoding_work_mem = 64MB
temp_file_limit = -1

# ------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL)
# ------------------------------------------------------------------------------
wal_level = replica
fsync = on
synchronous_commit = on
wal_sync_method = fsync
full_page_writes = on
wal_log_hints = off
wal_buffers = -1
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# ------------------------------------------------------------------------------
# CHECKPOINTS
# ------------------------------------------------------------------------------
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
checkpoint_flush_after = 256kB
checkpoint_warning = 30s

# ------------------------------------------------------------------------------
# QUERY TUNING
# ------------------------------------------------------------------------------
random_page_cost = 4.0
effective_cache_size = 4GB # Assumes reasonable system memory

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = -1

# ------------------------------------------------------------------------------
# AUTOVACUUM
# ------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50