# ==============================================================================
# MONGODB CONFIGURATION
# ==============================================================================
# Configuration file for the mongod process.
# ==============================================================================

# ------------------------------------------------------------------------------
# NETWORK CONFIGURATION
# ------------------------------------------------------------------------------
net:
  bindIp: 0.0.0.0
  maxIncomingConnections: 100
  compression:
    compressors: snappy,zstd,zlib

# ------------------------------------------------------------------------------
# STORAGE CONFIGURATION
# ------------------------------------------------------------------------------
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

# ------------------------------------------------------------------------------
# SYSTEM LOG
# ------------------------------------------------------------------------------
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

# ------------------------------------------------------------------------------
# OPERATION PROFILING
# ------------------------------------------------------------------------------
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100