# ==============================================================================
# 01-DATA STACK
# ==============================================================================
# Core data services: Postgres, MongoDB, Redis, Elasticsearch, SeaweedFS.
# ==============================================================================
name: 01-data

# ------------------------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------------------------
networks:
  default:
    name: global-infra
    external: true

# ------------------------------------------------------------------------------
# VOLUMES
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
  mongo_data:
  mongo_config:
  redis_data:
  elasticsearch_data:
  seaweedfs_data:
  kibana_token:

# ------------------------------------------------------------------------------
# SERVICES
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.4}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Check .env file}
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
      # Additional DBs and Users for other services (via init script)
      KONG_DB_NAME: ${KONG_DB_NAME:-kong}
      KONG_DB_USER: ${KONG_DB_USER:-kong}
      KONG_DB_PASSWORD: ${KONG_DB_PASSWORD:? Check .env file}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:? Check .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-main_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=postgres"
      - "com.microservices.tier=data"

  # ----------------------------------------------------------------------------
  # MongoDB
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:${MONGO_VERSION:-8.3}
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_USER: ${MONGO_USER:-mongoadmin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:? Check .env file}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:? Check .env file}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo/init:/docker-entrypoint-initdb.d
      - ./mongo/config/mongod.conf:/etc/mongod.conf
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=mongo"
      - "com.microservices.tier=data"

  # ----------------------------------------------------------------------------
  # Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-8.2.8}
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_USER: ${REDIS_USER:-redis_user}
      REDIS_PASSWORD: ${REDIS_PASSWORD:? Check .env file}
    command: >
      sh -c "
      echo 'user default on >\${REDIS_PASSWORD} ~* +@all' > /usr/local/etc/redis/users.acl &&
      echo 'user \${REDIS_USER} on >\${REDIS_PASSWORD} ~* +@all' >> /usr/local/etc/redis/users.acl &&
      redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      "
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=redis"
      - "com.microservices.tier=data"

  # ----------------------------------------------------------------------------
  # Elasticsearch
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.4.4}
    container_name: elasticsearch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    environment:
      - ELASTIC_CLUSTER_NAME=${ELASTIC_CLUSTER_NAME:-docker-cluster}
      - ELASTIC_DISCOVERY_TYPE=${ELASTIC_DISCOVERY_TYPE:-single-node}
      - ELASTIC_XPACK_SECURITY=${ELASTIC_XPACK_SECURITY:-true}
      - "ES_JAVA_OPTS=${ELASTIC_JAVA_OPTS:- -Xms512m -Xmx512m}"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:? Check .env file}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch/init/init.sh:/usr/share/elasticsearch/init/init.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=elasticsearch"
      - "com.microservices.tier=data"

  # ----------------------------------------------------------------------------
  # Elasticsearch Init (Kibana Service Token)
  # ----------------------------------------------------------------------------
  elasticsearch-init:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.4.4}
    container_name: elasticsearch-init
    restart: "no"
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:? Check .env file}
    volumes:
      - ./elasticsearch/init/init.sh:/init.sh:ro
      - kibana_token:/token
    command: ["/bin/bash", "/init.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=elasticsearch-init"
      - "com.microservices.tier=data"
      - "com.microservices.type=init"

  # ----------------------------------------------------------------------------
  # SeaweedFS (Distributed S3 & Object Storage)
  # ----------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.40}
    container_name: seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -master.port=9333 -volume.port=8080 -filer=true -filer.port=8888 -s3=true -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0"
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_VOLUME_PORT:-8084}:8080"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/config/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.microservices.service=seaweedfs"
      - "com.microservices.tier=data"

  # ----------------------------------------------------------------------------
  # SeaweedFS Init (Bucket Creation & IAM Setup)
  # ----------------------------------------------------------------------------
  seaweedfs-init:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.40}
    container_name: seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      SEAWEEDFS_ADMIN_USER: ${SEAWEEDFS_ADMIN_USER:-admin}
      SEAWEEDFS_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:? Check .env file}
      OBSERVABILITY_USER: ${OBSERVABILITY_USER:-observability-service}
      OBSERVABILITY_SERVICE_PASSWORD: ${OBSERVABILITY_SERVICE_PASSWORD:? Check .env file}
      APP_SERVICE_USER: ${APP_SERVICE_USER:-app-service}
      APP_SERVICE_PASSWORD: ${APP_SERVICE_PASSWORD:? Check .env file}
      BACKUP_SERVICE_USER: ${BACKUP_SERVICE_USER:-backup-service}
      BACKUP_SERVICE_PASSWORD: ${BACKUP_SERVICE_PASSWORD:? Check .env file}
    volumes:
      - seaweedfs_data:/data:ro
      - ./seaweedfs/init/init.sh:/init/init.sh:ro
      - ./seaweedfs/config:/etc/seaweedfs
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"
    labels:
      - "com.microservices.service=seaweedfs-init"
      - "com.microservices.tier=data"