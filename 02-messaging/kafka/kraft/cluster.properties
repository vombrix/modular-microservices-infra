# ==============================================================================
# KAFKA KRAFT CONFIGURATION
# ==============================================================================
# Configuration for Kafka running in KRaft mode (ZooKeeper-less).
# ==============================================================================

# ------------------------------------------------------------------------------
# SERVER BASICS
# ------------------------------------------------------------------------------
# The role of this node in the cluster.
process.roles=broker,controller

# Unique integer identifier for this node.
node.id=1

# The listener name used for inter-broker communication.
controller.listener.names=CONTROLLER

# ------------------------------------------------------------------------------
# LISTENERS & CONNECTIVITY
# ------------------------------------------------------------------------------
# Listeners to bind to.
listeners=PLAINTEXT://:9092,CONTROLLER://:9093

# Advertised listeners for clients (mapped via Docker Compose).
# advertised.listeners is handled via environment variables in docker-compose.yml

listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

# ------------------------------------------------------------------------------
# STORAGE (LOG)
# ------------------------------------------------------------------------------
# Directory for persisting log data.
log.dirs=/var/lib/kafka/data

# Number of partitions for automatically created topics.
num.partitions=1

# Log retention policies.
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# ------------------------------------------------------------------------------
# KRaft VOTERS
# ------------------------------------------------------------------------------
# The voters for the controller quorum.
controller.quorum.voters=1@localhost:9093

# ------------------------------------------------------------------------------
# THREADING & PERFORMANCE
# ------------------------------------------------------------------------------
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ------------------------------------------------------------------------------
# INTERNAL TOPIC SETTINGS
# ------------------------------------------------------------------------------
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
