# ==============================================================================
# KAFKA UI CONFIGURATION
# ==============================================================================
# Configuration for the Kafka UI web interface.
# ==============================================================================

kafka:
  # ------------------------------------------------------------------------------
  # CLUSTER DEFINITIONS
  # ------------------------------------------------------------------------------
  clusters:
    - name: local
      bootstrapServers: kafka:9092
      metrics:
        port: 9101
        type: JMX
      properties:
        auto.offset.reset: earliest
        compression.type: gzip
        max.request.size: 1048576

# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------
auth:
  type: DISABLED

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.provectus: DEBUG

# ------------------------------------------------------------------------------
# MANAGEMENT & HEALTH
# ------------------------------------------------------------------------------
management:
  health:
    ldap:
      enabled: false

# ------------------------------------------------------------------------------
# SERVER SETTINGS
# ------------------------------------------------------------------------------
server:
  servlet:
    context-path: /

# ------------------------------------------------------------------------------
# SPRING SETTINGS
# ------------------------------------------------------------------------------
spring:
  jmx:
    enabled: true
